    <rect x="130" y="-250" width="90" height="250" rx="10" fill="url(#bar)"/>
    <rect x="260" y="-210" width="90" height="210" rx="10" fill="url(#bar)"/>
    <rect x="390" y="-330" width="90" height="330" rx="10" fill="url(#bar)"/>
    <rect x="520" y="-300" width="90" height="300" rx="10" fill="url(#bar)"/>
    <rect x="650" y="-420" width="90" height="420" rx="10" fill="url(#bar)"/>
    <path d="M45-200 L175-270 L305-230 L435-350 L565-320 L695-440" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".9"/>
    <g fill="#ffffff"><circle cx="45" cy="-200" r="9"/><circle cx="175" cy="-270" r="9"/><circle cx="305" cy="-230" r="9"/><circle cx="435" cy="-350" r="9"/><circle cx="565" cy="-320" r="9"/><circle cx="695" cy="-440" r="9"/></g>
    <line x1="-40" y1="0" x2="900" y2="0" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
  </g>
