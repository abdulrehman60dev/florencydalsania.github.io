    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5fd3c2" stop-opacity=".35"/><stop offset="1" stop-color="#5fd3c2"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b7f0e5"/><stop offset="1" stop-color="#5fd3c2"/></linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="960" cy="180" r="260" fill="#5fd3c2" fill-opacity=".07"/>
  <circle cx="960" cy="180" r="170" fill="#5fd3c2" fill-opacity=".07"/>
