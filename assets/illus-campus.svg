<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Architectural line illustration of a university campus building">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2a3a"/><stop offset="1" stop-color="#2f4a63"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd3c2" stop-opacity=".18"/><stop offset="1" stop-color="#5fd3c2" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="950" cy="170" r="240" fill="url(#sky)"/>
  <circle cx="950" cy="170" r="70" fill="#f6f3ee" fill-opacity=".9"/>
  <g fill="none" stroke="#f6f3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M60 600 h1080" stroke-width="4"/>
    <!-- main hall -->
    <rect x="360" y="300" width="480" height="300"/>
    <path d="M340 300 h520 M600 300 l-140 -110 h280 z"/>
    <path d="M600 190 v-60 M585 130 h30 M600 130 l16 -18 l-16 -18 v36" stroke-width="2.5"/>
    <!-- arches -->
    <path d="M400 600 v-120 a40 40 0 0 1 80 0 v120 M520 600 v-120 a40 40 0 0 1 80 0 v120 M640 600 v-120 a40 40 0 0 1 80 0 v120 M760 600 v-120 a40 40 0 0 1 80 0 v120" stroke-opacity=".9"/>
    <!-- upper windows -->
    <g stroke-opacity=".8"><rect x="400" y="330" width="60" height="90" rx="30"/><rect x="520" y="330" width="60" height="90" rx="30"/><rect x="640" y="330" width="60" height="90" rx="30"/><rect x="760" y="330" width="60" height="90" rx="30"/></g>
    <!-- wings -->
    <rect x="140" y="400" width="220" height="200"/><path d="M120 400 h240 M140 400 l110 -70 l110 70"/>
    <g stroke-opacity=".7"><rect x="170" y="440" width="40" height="60"/><rect x="230" y="440" width="40" height="60"/><rect x="290" y="440" width="40" height="60"/><rect x="230" y="530" width="40" height="70"/></g>
    <rect x="840" y="400" width="220" height="200"/><path d="M840 400 h240 M840 400 l110 -70 l110 70"/>
    <g stroke-opacity=".7"><rect x="870" y="440" width="40" height="60"/><rect x="930" y="440" width="40" height="60"/><rect x="990" y="440" width="40" height="60"/><rect x="930" y="530" width="40" height="70"/></g>
    <!-- trees -->
    <g stroke-opacity=".75"><path d="M90 600 v-60 M90 540 c-30 -10 -35 -60 0 -70 c35 10 30 60 0 70"/><path d="M1110 600 v-60 M1110 540 c-30 -10 -35 -60 0 -70 c35 10 30 60 0 70"/></g>
    <!-- path -->
    <path d="M560 600 q40 60 40 120 M640 600 q-40 60 -40 120" stroke-opacity=".5"/>
  </g>
</svg>
